name: Linting

on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

permissions:
  contents: read

jobs:
    lint:
        name: ESLint
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Set up pnpm
            uses: pnpm/action-setup@v6

          - name: Setup Node.js
            uses: actions/setup-node@v6
            with: 
                node-version: 24
                cache: 'pnpm'
                cache-dependency-path: pnpm-lock.yaml

          - name: Install workspace dependencies
            run: pnpm install --frozen-lockfile

          - name: Lint frontend
            run: pnpm --filter frontend lint

          - name: Lint backend
            run: pnpm --filter @causolve/backend lint
