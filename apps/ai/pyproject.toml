[project]
name = "causolve-ai"
version = "0.1.0"
description = "Causolve internal AI service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai<3",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["external: makes real external API requests and requires explicit opt-in"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
